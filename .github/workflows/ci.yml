name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Verify OpenAPI inventory and coverage manifest
        run: npm run coverage:api:check
      - name: Verify generated migration and toolset documentation
        run: |
          npm run migration:check
          npm run toolsets:check
      - name: Enforce catalog-size budget
        run: node --test test/contract/mcp/catalog-size.contract.test.js
      - name: Enforce selection evaluation and generated evidence
        run: |
          npm run test:evaluation
          npm run evaluation:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm audit --audit-level=high

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:container
