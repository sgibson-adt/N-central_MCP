services:
  ncentral-rest-api-mcp:
    build: .
    container_name: n-central-rest-api-mcp
    # Loads all env vars from .env. NC_SERVER_URL / NC_JWT_TOKEN / MCP_API_KEY are required.
    env_file:
      - .env
    # Published on localhost by default. MCP_API_KEY MUST be set for /mcp.
    # /healthz is open; /metrics is open unless MCP_METRICS_REQUIRE_AUTH=1.
    # Change the left side to 0.0.0.0 only behind a trusted network/firewall.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      # Inside the container the listener must bind to all interfaces so the
      # host port mapping can reach it. The left side of `ports:` controls host exposure.
      MCP_BIND_ADDRESS: 0.0.0.0
      MCP_PORT: 3100
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
